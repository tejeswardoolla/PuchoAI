<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gemini Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h3>✨ Gemini Assistant</h3>
      <button id="optionsBtn" title="Settings">⚙️</button>
    </div>
    <div class="content">
      <p>Use <strong>Alt+B</strong> to open the floating assistant on any webpage.</p>
      <button id="openSliderBtn">Open on Current Page</button>
      <div id="errorMessage" style="color: #f48771; font-size: 13px; margin-top: 15px; display: none;"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
